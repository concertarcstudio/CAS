name: CAS Automation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      rebuild_indexes:
        description: Rebuild generated CAS indexes
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate CAS artifacts
        run: python automation/cas_automation.py validate

  rebuild-indexes:
    if: github.event_name == 'workflow_dispatch' && inputs.rebuild_indexes
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild indexes
        run: python automation/cas_automation.py index

      - name: Commit generated indexes
        run: |
          if [ -z "$(git status --porcelain -- generated)" ]; then
            echo "No generated index changes."
            exit 0
          fi
          git config user.name "cas-automation[bot]"
          git config user.email "cas-automation[bot]@users.noreply.github.com"
          git add generated
          git commit -m "chore(automation): rebuild CAS indexes"
          git push
